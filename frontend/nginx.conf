server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Mesmo contrato do proxy do Vite: /api/* -> FastAPI sem o prefixo.
    # Upstream em variável + resolver do Docker: o nome "app" é resolvido por
    # requisição, então o nginx sobe mesmo se o backend ainda não estiver no ar.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://app:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: rotas do React Router caem no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}

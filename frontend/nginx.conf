server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Core Service: Professores
    location /api/professores {
        resolver 127.0.0.11 valid=10s;
        set $core_upstream http://core-service:8001;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $core_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Core Service: Disciplinas
    location /api/disciplinas {
        resolver 127.0.0.11 valid=10s;
        set $core_upstream http://core-service:8001;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $core_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Auth Service: /api/* -> FastAPI (app:8000)
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://app:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: rotas do React Router caem no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}

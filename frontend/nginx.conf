# Login: no máximo 10 tentativas por minuto por IP (mais 5 de folga), contra quem tenta
# adivinhar senhas
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Em produção as requisições chegam pelo Caddy (rede do Docker): o IP do cliente vem no
    # X-Forwarded-For, e é ele que conta no limite de tentativas de login
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;

    # Documentação das APIs (Swagger) não fica pública; no ambiente local ela continua em
    # localhost:8000/docs e localhost:8001/docs
    location ~ ^/api/(docs|redoc|openapi\.json) {
        return 404;
    }

    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        error_page 429 = @muitas_tentativas;
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://app:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @muitas_tentativas {
        default_type application/json;
        return 429 '{"detail": "Muitas tentativas de login. Aguarde um minuto e tente de novo."}';
    }

    # Core Service: Professores
    location /api/professores {
        resolver 127.0.0.11 valid=10s;
        set $core_upstream http://core-service:8001;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $core_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Core Service: Disciplinas
    location /api/disciplinas {
        resolver 127.0.0.11 valid=10s;
        set $core_upstream http://core-service:8001;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $core_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Core Service: Salas
    location /api/salas {
        resolver 127.0.0.11 valid=10s;
        set $core_upstream http://core-service:8001;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $core_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Core Service: Turmas
    location /api/turmas {
        resolver 127.0.0.11 valid=10s;
        set $core_upstream http://core-service:8001;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $core_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Core Service: Disponibilidades
    location /api/disponibilidades {
        resolver 127.0.0.11 valid=10s;
        set $core_upstream http://core-service:8001;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $core_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Core Service: Grades
    location /api/grades {
        resolver 127.0.0.11 valid=10s;
        set $core_upstream http://core-service:8001;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $core_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Core Service: Configurações da escola
    location /api/configuracoes {
        resolver 127.0.0.11 valid=10s;
        set $core_upstream http://core-service:8001;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $core_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Auth Service: /api/* -> FastAPI (app:8000)
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://app:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: rotas do React Router caem no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}

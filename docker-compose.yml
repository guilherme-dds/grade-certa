services:
  db:
    image: mysql:8.0
    container_name: grade_certa_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: grade_certa
      MYSQL_USER: grade_user
      MYSQL_PASSWORD: grade_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: grade_certa_app
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql+pymysql://grade_user:grade_password@db:3306/grade_certa
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./auth-service:/app

  core-service:
    build:
      context: .
      dockerfile: core-service/Dockerfile
    container_name: grade_certa_core
    restart: always
    ports:
      - "8001:8001"
    volumes:
      - ./core-service:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: grade_certa_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - app
      - core-service

volumes:
  mysql_data:

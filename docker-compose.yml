services:
  db:
    image: mysql:8.0
    container_name: grade_certa_db
    restart: always
    environment:
      # Senhas lidas do .env (DB_PASSWORD, DB_ROOT_PASSWORD); os valores depois de ":-" só
      # valem no ambiente local. O MySQL só usa estas senhas ao criar o volume pela primeira vez
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: grade_certa
      MYSQL_USER: grade_user
      MYSQL_PASSWORD: ${DB_PASSWORD:-grade_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: grade_certa_app
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql+pymysql://grade_user:${DB_PASSWORD:-grade_password}@db:3306/grade_certa
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./auth-service:/app

  core-service:
    build:
      context: .
      dockerfile: core-service/Dockerfile
    container_name: grade_certa_core
    restart: always
    ports:
      - "8001:8001"
    # SECRET_KEY: valida o token emitido pelo auth-service
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql+pymysql://grade_user:${DB_PASSWORD:-grade_password}@db:3306/grade_certa
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./core-service:/app

  # Roda as gerações da fila (grades com status "gerando"), separado da API: reiniciar o
  # core não interrompe uma geração, e uma geração interrompida no worker é refeita
  worker:
    build:
      context: .
      dockerfile: core-service/Dockerfile
    container_name: grade_certa_worker
    restart: always
    command: ["python", "-m", "services.worker_geracao"]
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql+pymysql://grade_user:${DB_PASSWORD:-grade_password}@db:3306/grade_certa
    depends_on:
      db:
        condition: service_healthy
      core-service:
        condition: service_started
    volumes:
      - ./core-service:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: grade_certa_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - app
      - core-service

volumes:
  mysql_data:
